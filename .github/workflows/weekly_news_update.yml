name: Weekly News Update

on:
  schedule:
    - cron: '0 16 * * 0'   
  workflow_dispatch:

jobs:
  update_news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news and write to SQLite
        run: python src/core/batch_fetch.py

      - name: Run embedding for new articles
        run: python src/core/rag_embed.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/relations.db outputs/chroma_db
          git diff --staged --quiet || git commit -m "自動更新每週新聞資料與embedding"
          git push