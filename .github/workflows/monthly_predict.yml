name: Monthly Prediction Update

on:
  schedule:
    - cron: '0 1 1 * *'
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Run prediction pipeline
        run: python src/predict_pipeline.py

      - name: Update last-updated date in README
        run: |
          TODAY=$(date +'%Y-%m-%d')
          sed -i "s/最近更新日期: .*/最近更新日期: ${TODAY}/" README.md

      - name: Commit and push updated outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/ README.md
          git diff --staged --quiet || git commit -m "自動更新每月預測結果"
          git push