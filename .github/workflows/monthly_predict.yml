name: Monthly Prediction Update

on:
  schedule:
    - cron: '0 1 1 * *'
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Debug - check working directory and files
        run: |
          echo "=== 目前工作目錄 ==="
          pwd
          echo "=== 根目錄內容 ==="
          ls -la
          echo "=== data 資料夾內容 ==="
          ls -la data/ || echo "data/ 不存在"
          echo "=== data/processed 資料夾內容 ==="
          ls -la data/processed/ || echo "data/processed/ 不存在"
          echo "=== src 資料夾內容 ==="
          ls -la src/
          echo "=== src/core 資料夾內容 ==="
          ls -la src/core/ || echo "src/core/ 不存在"

      - name: Run prediction pipeline
        run: python src/predict_pipeline.py

      - name: Commit and push updated outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --staged --quiet || git commit -m "自動更新每月預測結果"
          git push